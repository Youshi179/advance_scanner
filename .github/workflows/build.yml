name: Build Youshi Scanner (APK + Web)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android,web --project-name youshi_scanner .
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
      - name: flutter_secure_storage needs minSdk 23
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle.kts || true
      - name: Ensure INTERNET permission in main manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          fi
      - name: Ensure Notification permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$M"
          fi
      - name: Fix Desugaring
        run: |
          ls android/app
          python3 - <<'PY'
          import os
          if os.path.exists('android/app/build.gradle.kts'):
              p = 'android/app/build.gradle.kts'
              flag = 'isCoreLibraryDesugaringEnabled = true'
              dep = 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              p = 'android/app/build.gradle'
              flag = 'coreLibraryDesugaringEnabled true'
              dep = 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
          s = open(p).read()
          if 'CoreLibraryDesugaringEnabled' not in s and 'coreLibraryDesugaringEnabled' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        ' + flag, 1)
          if 'desugar_jdk_libs' not in s:
              s += '\n' + dep
          open(p, 'w').write(s)
          print('USING FILE:', p)
          PY
          echo "=========== FULL FILE ==========="
          cat android/app/build.gradle*
          grep -q "desugar_jdk_libs" android/app/build.gradle* || { echo "ERROR: dependency missing"; exit 1; }
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Youshi-Scanner-Release
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=web --project-name youshi_scanner .
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4